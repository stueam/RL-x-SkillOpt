_base_: ../../../configs/_base_/default.yaml

train:
  num_epochs: 4
  batch_size: 8
  accumulation: 1
  seed: 42

env:
  name: cap_set
  skill_init: ../benchmarks/cap_set/skillopt_env/skills/initial.md
  split_mode: split_dir
  split_dir: ../benchmarks/cap_set/data
  split_output_dir: ""
  exec_timeout: 90
  workers: 4
  limit: 0
  max_completion_tokens: 4096

gradient:
  minibatch_size: 4
  merge_batch_size: 2
  analyst_workers: 2
  max_analyst_rounds: 3
  failure_only: false

optimizer:
  learning_rate: 3
  min_learning_rate: 2
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: false
  slow_update_samples: 4
  use_meta_skill: false
  use_skill_aware_reflection: false

evaluation:
  use_gate: true
  gate_metric: soft
  gate_mixed_weight: 0.0
  sel_env_num: 5
  test_env_num: 5
  eval_test: true

model:
  backend: openai_chat
  optimizer: deepseek/deepseek-chat
  target: qwen/qwen3-coder-30b-a3b-instruct
  optimizer_backend: openai_chat
  target_backend: openai_chat
  reasoning_effort: ""
  azure_openai_endpoint: https://openrouter.ai/api/v1
  azure_openai_auth_mode: openai_compatible
  target_azure_openai_endpoint: https://openrouter.ai/api/v1
  target_azure_openai_auth_mode: openai_compatible
