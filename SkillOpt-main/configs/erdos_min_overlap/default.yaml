_base_: ../_base_/default.yaml

train:
  num_epochs: 8
  batch_size: 8
  accumulation: 1
  seed: 42

env:
  name: erdos_min_overlap
  skill_init: skillopt/envs/erdos_min_overlap/skills/initial.md
  split_mode: split_dir
  split_dir: data/erdos_min_overlap_split
  split_output_dir: ""
  exec_timeout: 600
  workers: 8
  limit: 0
  max_completion_tokens: 24000

gradient:
  minibatch_size: 8
  merge_batch_size: 4
  analyst_workers: 4
  max_analyst_rounds: 3
  failure_only: false

optimizer:
  learning_rate: 6
  min_learning_rate: 3
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: false
  slow_update_samples: 4
  use_meta_skill: false
  use_skill_aware_reflection: false

evaluation:
  use_gate: false
  gate_metric: soft
  gate_mixed_weight: 0.0
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

model:
  backend: openai_chat
  optimizer: openai/gpt-5.4
  target: qwen/qwen3-coder-30b-a3b-instruct
  optimizer_backend: openai_chat
  target_backend: qwen_chat
  azure_openai_endpoint: https://openrouter.ai/api/v1
  azure_openai_auth_mode: openai_compatible
  qwen_chat_base_url: https://openrouter.ai/api/v1
  qwen_chat_api_key: "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"
