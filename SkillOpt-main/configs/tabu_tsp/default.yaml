_base_: ../_base_/default.yaml

train:
  num_epochs: 4
  batch_size: 4
  accumulation: 1
  seed: 42

env:
  name: tabu_tsp
  skill_init: skillopt/envs/tabu_tsp/skills/initial.md
  split_mode: split_dir
  split_dir: data/tabu_tsp_split
  split_output_dir: ""
  exec_timeout: 60
  workers: 2
  limit: 0
  max_completion_tokens: 8192

gradient:
  minibatch_size: 4
  merge_batch_size: 2
  analyst_workers: 2
  max_analyst_rounds: 2
  failure_only: false

optimizer:
  learning_rate: 3
  min_learning_rate: 2
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: false
  slow_update_samples: 4
  use_meta_skill: false
  use_skill_aware_reflection: false

evaluation:
  use_gate: true
  gate_metric: soft
  gate_mixed_weight: 0.0
  sel_env_num: 0
  test_env_num: 0
  eval_test: true

model:
  backend: openai_chat
  optimizer: deepseek/deepseek-chat
  target: deepseek-v4-flash
  optimizer_backend: openai_chat
  target_backend: openai_chat
  azure_openai_endpoint: https://openrouter.ai/api/v1
  azure_openai_auth_mode: openai_compatible
  target_azure_openai_endpoint: https://api.deepseek.com
  target_azure_openai_auth_mode: openai_compatible
