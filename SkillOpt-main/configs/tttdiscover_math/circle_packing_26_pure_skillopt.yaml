_base_: ../_base_/default.yaml

model:
  backend: openai_chat
  optimizer: deepseek/deepseek-chat
  target: qwen/qwen3-coder-30b-a3b-instruct
  optimizer_backend: openai_chat
  target_backend: qwen_chat
  azure_openai_endpoint: https://openrouter.ai/api/v1
  azure_openai_auth_mode: openai_compatible
  qwen_chat_base_url: https://openrouter.ai/api/v1

train:
  train_size: 8
  batch_size: 4
  num_epochs: 3

gradient:
  minibatch_size: 4
  merge_batch_size: 4
  analyst_workers: 4

optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  gate_metric: hard
  sel_env_num: 4
  test_env_num: 8
  eval_test: true

env:
  name: tttdiscover_math
  skill_init: skillopt/envs/tttdiscover_math/skills/initial.md
  problem_type: circle_packing_26
  discovery_train_size: 8
  discovery_val_size: 4
  discovery_test_size: 8
  num_circles: 26
  circle_target: 2.636
  exec_timeout: 300
  workers: 4
  max_completion_tokens: 4096
  out_root: outputs/circlepacking_pure_skillopt
